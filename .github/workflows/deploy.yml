name: Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - main
  # 코드 변경 없이 다시 배포해야 할 때 수동 실행
  workflow_dispatch:

# 연속 push 시 앞선 배포를 취소하고 마지막 것만 반영한다
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint / format / build 검증. 실패하면 배포하지 않는다
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      # ci 잡과 러너가 분리돼 dist를 물려받을 수 없으므로 여기서 다시 만든다
      - name: "🏗️ Build"
        run: pnpm run build

      - name: "🚀 Deploy"
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
